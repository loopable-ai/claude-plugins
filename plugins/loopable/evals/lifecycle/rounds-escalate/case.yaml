schema_version: "1.1"
name: lifecycle-rounds-escalate
description: "Two fix rounds each extended the same replacement table, and the third ship's verifier finds the next letter it misses: the fixes do not hold and a third round is due, so the round goes to the master builder — fix_round and escalated posted, the amendment saying why — never back to the builder, and nothing merges."
tags: [lifecycle, rounds]
plugins: ["../../.."]
context:
  scaffold_script: fixture.sh
graders:
  - name: read-role
    type: "tool_used"
    tool: "Read"
    input_match: "\\.loopable-eval/role\\.md"
  - name: to-the-master-builder
    type: "tool_used"
    tool: "Agent"
    input_match: "loopable:masterbuilder"
  - name: not-to-the-builder
    type: "tool_used"
    tool: "Agent"
    input_match: "loopable:builder(?![a-z-])"
    min: 0
    max: 0
  - name: escalated-posted
    type: "regex"
    target: {"source": "file", "path": ".loopable-eval/backlog-events.jsonl"}
    pattern: "\"op\": \"post_activity\"[^\\n]*\"ok\": true[^\\n]*\"event\": \"escalated\""
  - name: round-three-posted
    type: "regex"
    target: {"source": "file", "path": ".loopable-eval/backlog-events.jsonl"}
    pattern: "\"event\": \"fix_round\"[^\\n]*\"n\": \"?3\\b"
  - name: amendment-says-why
    type: "regex"
    target: {"source": "file", "path": ".git/worktrees/page-paths-41/loopable/brief.md"}
    pattern: "Round 2[\\s\\S]*master ?builder"
    flags: "i"
  - name: says-who-and-why
    type: "regex"
    target: {"source": "file", "path": ".loopable-eval/outcome.md"}
    pattern: "master ?builder"
    flags: "i"
  - name: no-merge-requested
    type: "file_exists"
    path: ".loopable-eval/merge-requested"
    exists: false
