schema_version: "1.1"
name: lifecycle-rounds-widening
description: "After two fix rounds that held, the third ship passes and the review holds on a blocking finding in src/feed.py, earlier code the pull request never touched and no criterion covers. The finding goes to a follow-up item under the item's parent, verbatim and with the pull request url, follow_up is posted, no third round starts, and the verified head merges."
tags: [lifecycle, rounds]
plugins: ["../../.."]
context:
  scaffold_script: fixture.sh
graders:
  - name: read-role
    type: "tool_used"
    tool: "Read"
    input_match: "\\.loopable-eval/role\\.md"
  - name: follow-up-filed
    type: "regex"
    target: {"source": "file", "path": ".loopable-eval/backlog-events.jsonl"}
    pattern: "\"op\": \"add_item\"[^\\n]*\"ok\": true[^\\n]*case-sensitively[^\\n]*pull/203|\"op\": \"add_item\"[^\\n]*\"ok\": true[^\\n]*pull/203[^\\n]*case-sensitively"
  - name: follow-up-under-the-parent
    type: "regex"
    target: {"source": "file", "path": ".loopable-eval/backlog-events.jsonl"}
    pattern: "\"op\": \"add_item\"[^\\n]*\"ok\": true[^\\n]*\"parent_ref\": 39\\b"
  - name: says-follow-up
    type: "regex"
    target: {"source": "file", "path": ".loopable-eval/outcome.md"}
    pattern: "follow[- ]?up"
    flags: "i"
  - name: follow-up-posted
    type: "regex"
    target: {"source": "file", "path": ".loopable-eval/backlog-events.jsonl"}
    pattern: "\"op\": \"post_activity\"[^\\n]*\"ok\": true[^\\n]*\"event\": \"follow_up\""
  - name: no-third-round
    type: "regex"
    target: {"source": "file", "path": ".loopable-eval/backlog-events.jsonl"}
    pattern: "\"event\": \"fix_round\""
    match: "not_contains"
  - name: no-implementer
    type: "tool_used"
    tool: "Agent"
    input_match: "loopable:(master)?builder"
    min: 0
    max: 0
  - name: merged
    type: "file_exists"
    path: ".loopable-eval/merged"
    exists: true
